<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30秒連點速度大挑戰 - Player vs AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti 畫彩帶庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* 霓虹發光效果 */
        .glow-player {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5), inset 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .glow-ai {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5), inset 0 0 15px rgba(239, 68, 68, 0.3);
        }
        .glow-btn {
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.6);
        }
        .glow-btn:hover {
            box-shadow: 0 0 50px rgba(168, 85, 247, 0.9);
        }

        /* 按鈕點擊按壓特效 */
        .click-btn-active {
            transform: scale(0.95);
            filter: brightness(1.2);
        }

        /* 點擊浮動文字彈出動畫 */
        @keyframes popUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.8) translateY(0);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3) translateY(-30px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) translateY(-60px);
            }
        }
        .click-pop {
            position: absolute;
            pointer-events: none;
            animation: popUp 0.6s ease-out forwards;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* 畫面震動效果 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(-1deg); }
            40% { transform: translate(2px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake-effect {
            animation: shake 0.15s ease-in-out;
        }

        /* 平滑進度條 transitions */
        .progress-bar-inner {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 overflow-x-hidden">

    <!-- 背景動態裝飾點陣 -->
    <div class="fixed inset-0 pointer-events-none opacity-20 bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:24px_24px]"></div>

    <!-- 頂部頁首與標題 -->
    <header class="w-full max-w-2xl text-center z-10 mt-2">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700 text-slate-300 text-xs sm:text-sm mb-3">
            <i class="fa-solid fa-bolt text-yellow-400"></i> 極速手速對決
        </div>
        <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500">
            30秒連點挑戰賽
        </h1>
        <p class="text-slate-400 text-xs sm:text-base mt-2">
            目標：在 <span class="text-yellow-400 font-bold">30 秒</span> 內瘋狂連點！AI 機器人每秒約點擊 <span class="text-red-400 font-bold">5 下</span>，你能勝過它嗎？
        </p>
    </header>

    <!-- 主要遊戲區域 -->
    <main class="w-full max-w-2xl bg-slate-900/90 border border-slate-800 rounded-3xl p-5 sm:p-8 backdrop-blur-md shadow-2xl my-auto z-10 relative">

        <!-- 倒數計時器 display -->
        <div class="text-center mb-6">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">剩餘時間 (Time Left)</div>
            <div id="timer" class="text-5xl sm:text-6xl font-black text-amber-400 tracking-wider font-mono">
                30.0s
            </div>
        </div>

        <!-- 雙重連點進度條 (Player vs AI) -->
        <div class="space-y-5 mb-8">
            <!-- 玩家進度條 -->
            <div>
                <div class="flex justify-between items-end mb-1 text-sm sm:text-base">
                    <span class="font-bold text-blue-400 flex items-center gap-2">
                        <i class="fa-solid fa-user"></i> 玩家 (YOU)
                    </span>
                    <div class="text-right">
                        <span id="player-clicks-count" class="font-black text-xl text-blue-400">0</span>
                        <span class="text-xs text-slate-400"> 下</span>
                        <span id="player-cps" class="text-xs text-blue-300 ml-2 font-mono bg-blue-950/60 px-2 py-0.5 rounded border border-blue-800/50">0.0 CPS</span>
                    </div>
                </div>
                <div class="w-full h-6 bg-slate-800 rounded-full overflow-hidden p-1 border border-slate-700/80 shadow-inner">
                    <div id="player-bar" class="progress-bar-inner h-full bg-gradient-to-r from-blue-600 to-cyan-400 rounded-full w-0 glow-player"></div>
                </div>
            </div>

            <!-- AI 進度條 -->
            <div>
                <div class="flex justify-between items-end mb-1 text-sm sm:text-base">
                    <span class="font-bold text-red-400 flex items-center gap-2">
                        <i class="fa-solid fa-robot"></i> AI 機器人 (CPS ~5)
                    </span>
                    <div class="text-right">
                        <span id="ai-clicks-count" class="font-black text-xl text-red-400">0</span>
                        <span class="text-xs text-slate-400"> 下</span>
                        <span id="ai-cps" class="text-xs text-red-300 ml-2 font-mono bg-red-950/60 px-2 py-0.5 rounded border border-red-800/50">0.0 CPS</span>
                    </div>
                </div>
                <div class="w-full h-6 bg-slate-800 rounded-full overflow-hidden p-1 border border-slate-700/80 shadow-inner">
                    <div id="ai-bar" class="progress-bar-inner h-full bg-gradient-to-r from-red-600 to-orange-400 rounded-full w-0 glow-ai"></div>
                </div>
            </div>
        </div>

        <!-- 點擊互動主要大按鈕區 -->
        <div id="click-area" class="relative flex justify-center items-center py-4">
            <button id="click-btn" disabled class="w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white font-black text-2xl sm:text-3xl shadow-2xl glow-btn transition-transform duration-75 flex flex-col justify-center items-center cursor-not-allowed opacity-60 border-4 border-indigo-300/30 active:scale-95">
                <i class="fa-solid fa-hand-pointer text-3xl sm:text-4xl mb-2 animate-bounce"></i>
                <span id="btn-text">準備好了嗎？</span>
                <span class="text-xs font-normal text-indigo-200 mt-1 opacity-80">點擊「開始遊戲」發動攻擊</span>
            </button>
        </div>

        <!-- 開始 / 重新開始控制鈕 -->
        <div class="mt-6 text-center">
            <button id="start-btn" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-extrabold text-lg shadow-lg hover:shadow-emerald-500/30 transition-all duration-200 flex items-center justify-center gap-2 mx-auto">
                <i class="fa-solid fa-play"></i> 開始遊戲
            </button>
        </div>

    </main>

    <!-- 頁腳 footer -->
    <footer class="text-center text-xs text-slate-500 my-4">
        HTML5 / JavaScript 30秒連點對決遊戲 &copy; 2026
    </footer>

    <!-- 結算彈窗 Modal (End Game Result Screen) -->
    <div id="result-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex justify-center items-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-6 sm:p-8 text-center shadow-2xl transform scale-90 transition-transform duration-300" id="modal-card">
            
            <!-- 勝利/失敗 圓形徽章 -->
            <div id="modal-badge-bg" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-3xl mb-4 border-4 shadow-xl">
                <i id="modal-icon" class="fa-solid fa-trophy"></i>
            </div>

            <h2 id="modal-title" class="text-3xl font-black mb-1">比賽結束！</h2>
            <p id="modal-subtitle" class="text-slate-400 text-sm mb-6">玩家與 AI 的極速大比拚</p>

            <!-- 點擊勝負差距重點卡片 -->
            <div id="margin-box" class="bg-slate-800/90 border border-slate-700 rounded-2xl p-4 mb-6">
                <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold mb-1">勝負差距 (Margin)</div>
                <div id="margin-text" class="text-xl sm:text-2xl font-black text-yellow-400">
                    --
                </div>
            </div>

            <!-- 詳細數據表格 -->
            <div class="grid grid-cols-2 gap-3 mb-6 text-left">
                <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                    <div class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-user text-blue-400"></i> 玩家總點擊</div>
                    <div id="stat-player-total" class="text-xl font-bold text-blue-400 mt-1">0 下</div>
                    <div id="stat-player-peak" class="text-[10px] text-slate-400">峰值: 0.0 CPS</div>
                </div>
                <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
                    <div class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-robot text-red-400"></i> AI 總點擊</div>
                    <div id="stat-ai-total" class="text-xl font-bold text-red-400 mt-1">0 下</div>
                    <div id="stat-ai-peak" class="text-[10px] text-slate-400">平均: 5.0 CPS</div>
                </div>
            </div>

            <!-- 再玩一次按鈕 -->
            <button id="restart-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 text-white font-bold text-lg shadow-lg hover:shadow-blue-500/30 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> 再玩一次
            </button>
        </div>
    </div>

    <!-- 邏輯腳本 JS -->
    <script>
        // --- 遊戲邏輯變數狀態 ---
        const GAME_DURATION = 30.0; // 遊戲時長 30 秒
        let timeLeft = GAME_DURATION;
        let isGaming = false;
        let timerInterval = null;
        let aiInterval = null;

        let playerClicks = 0;
        let aiClicks = 0;

        // CPS (Clicks Per Second) 計算隊列
        let playerClickTimestamps = [];
        let aiClickTimestamps = [];
        let playerPeakCPS = 0;

        // --- DOM 元件取得 ---
        const timerEl = document.getElementById('timer');
        const clickBtn = document.getElementById('click-btn');
        const btnText = document.getElementById('btn-text');
        const startBtn = document.getElementById('start-btn');
        const clickArea = document.getElementById('click-area');

        const playerClicksEl = document.getElementById('player-clicks-count');
        const aiClicksEl = document.getElementById('ai-clicks-count');
        const playerCpsEl = document.getElementById('player-cps');
        const aiCpsEl = document.getElementById('ai-cps');

        const playerBar = document.getElementById('player-bar');
        const aiBar = document.getElementById('ai-bar');

        // Modal DOM
        const resultModal = document.getElementById('result-modal');
        const modalCard = document.getElementById('modal-card');
        const modalBadgeBg = document.getElementById('modal-badge-bg');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const marginText = document.getElementById('margin-text');
        const statPlayerTotal = document.getElementById('stat-player-total');
        const statPlayerPeak = document.getElementById('stat-player-peak');
        const statAiTotal = document.getElementById('stat-ai-total');
        const statAiPeak = document.getElementById('stat-ai-peak');
        const restartBtn = document.getElementById('restart-btn');

        // 音效控制 (Web Audio API 合成音效)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(freq = 440, type = 'sine', duration = 0.05) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // 音效不影響遊戲進行
            }
        }

        // --- 遊戲初始化 / 重設 ---
        function resetGame() {
            clearInterval(timerInterval);
            clearInterval(aiInterval);

            timeLeft = GAME_DURATION;
            isGaming = false;
            playerClicks = 0;
            aiClicks = 0;
            playerClickTimestamps = [];
            aiClickTimestamps = [];
            playerPeakCPS = 0;

            timerEl.textContent = GAME_DURATION.toFixed(1) + 's';
            playerClicksEl.textContent = '0';
            aiClicksEl.textContent = '0';
            playerCpsEl.textContent = '0.0 CPS';
            aiCpsEl.textContent = '0.0 CPS';

            playerBar.style.width = '0%';
            aiBar.style.width = '0%';

            clickBtn.disabled = true;
            clickBtn.classList.add('opacity-60', 'cursor-not-allowed');
            clickBtn.classList.remove('opacity-100', 'cursor-pointer');
            btnText.textContent = '準備好了嗎？';

            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            startBtn.innerHTML = `<i class="fa-solid fa-play"></i> 開始遊戲`;
        }

        // --- 開始遊戲 ---
        function startGame() {
            resetGame();
            isGaming = true;

            // 啟用連點按鈕
            clickBtn.disabled = false;
            clickBtn.classList.remove('opacity-60', 'cursor-not-allowed');
            clickBtn.classList.add('opacity-100', 'cursor-pointer');
            btnText.textContent = '瘋狂連點！';

            // 禁用開始按鈕
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            startBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 對決進行中...`;

            // 倒數計時器 Loop (每 100ms 更新)
            const startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timeLeft = Math.max(0, GAME_DURATION - elapsed);
                timerEl.textContent = timeLeft.toFixed(1) + 's';

                // 即時計算並更新 CPS
                updateCPS();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 50);

            // AI 自動連點模擬器
            scheduleNextAIClick();
        }

        // --- AI 連點動態模擬 (平均每秒5下，約每200ms一下，加上自然波動) ---
        function scheduleNextAIClick() {
            if (!isGaming) return;

            // 每秒 5 下平均間隔為 200ms
            // 隨機在 160ms ~ 240ms 之間變化 (極端約4~6 CPS)
            const randomDelay = Math.floor(Math.random() * 80) + 160;

            aiInterval = setTimeout(() => {
                if (isGaming) {
                    triggerAIClick();
                    scheduleNextAIClick();
                }
            }, randomDelay);
        }

        function triggerAIClick() {
            aiClicks++;
            aiClickTimestamps.push(Date.now());
            aiClicksEl.textContent = aiClicks;
            updateProgressBars();
        }

        // --- 玩家點擊處理 ---
        function handlePlayerClick(e) {
            if (!isGaming) return;

            playerClicks++;
            playerClickTimestamps.push(Date.now());
            playerClicksEl.textContent = playerClicks;

            // 播放音效
            playSound(500 + Math.random() * 200, 'sine', 0.04);

            // 畫面打擊特效與彈出數值
            createClickPopEffect(e);
            triggerButtonPressEffect();

            // 更新進度條
            updateProgressBars();
        }

        // --- 點擊彈出動畫數值 (+1) ---
        function createClickPopEffect(e) {
            const rect = clickBtn.getBoundingClientRect();
            let x, y;

            if (e && e.clientX) {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            } else {
                // 若為鍵盤按壓觸發，產生在中心
                x = rect.width / 2;
                y = rect.height / 2;
            }

            const pop = document.createElement('div');
            pop.className = 'click-pop text-blue-300 text-2xl';
            pop.textContent = '+1';
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;

            clickBtn.appendChild(pop);

            setTimeout(() => {
                pop.remove();
            }, 600);
        }

        // --- 按鈕縮放打擊感 ---
        function triggerButtonPressEffect() {
            clickBtn.classList.add('click-btn-active');
            setTimeout(() => {
                clickBtn.classList.remove('click-btn-active');
            }, 80);
        }

        // --- 計算即時 CPS (Clicks Per Second) ---
        function updateCPS() {
            const now = Date.now();
            const oneSecondAgo = now - 1000;

            // 過濾一秒內的點擊時間戳
            playerClickTimestamps = playerClickTimestamps.filter(t => t > oneSecondAgo);
            aiClickTimestamps = aiClickTimestamps.filter(t => t > oneSecondAgo);

            const pCPS = playerClickTimestamps.length;
            const aCPS = aiClickTimestamps.length;

            if (pCPS > playerPeakCPS) {
                playerPeakCPS = pCPS;
            }

            playerCpsEl.textContent = `${pCPS.toFixed(1)} CPS`;
            aiCpsEl.textContent = `${aCPS.toFixed(1)} CPS`;
        }

        // --- 動態更新進度條 ---
        function updateProgressBars() {
            // 以雙方較高者或預期點擊數(150下)為基準動態計算百分比
            const maxVal = Math.max(playerClicks, aiClicks, 150);
            
            const playerPercent = Math.min(100, (playerClicks / maxVal) * 100);
            const aiPercent = Math.min(100, (aiClicks / maxVal) * 100);

            playerBar.style.width = `${playerPercent}%`;
            aiBar.style.width = `${aiPercent}%`;
        }

        // --- 結束遊戲與結果計算 ---
        function endGame() {
            isGaming = false;
            clearInterval(timerInterval);
            clearTimeout(aiInterval);

            clickBtn.disabled = true;
            clickBtn.classList.add('opacity-60', 'cursor-not-allowed');
            btnText.textContent = '時間到！';

            playSound(300, 'square', 0.3);

            // 震動畫面
            document.body.classList.add('shake-effect');
            setTimeout(() => document.body.classList.remove('shake-effect'), 200);

            // 計算勝負結果
            const diff = playerClicks - aiClicks;

            setTimeout(() => {
                showResultModal(diff);
            }, 500);
        }

        // --- 顯示結算彈窗 Modal ---
        function showResultModal(diff) {
            statPlayerTotal.textContent = `${playerClicks} 下`;
            statPlayerPeak.textContent = `最高: ${playerPeakCPS} CPS`;
            statAiTotal.textContent = `${aiClicks} 下`;
            statAiPeak.textContent = `平均: ${(aiClicks / GAME_DURATION).toFixed(1)} CPS`;

            if (diff > 0) {
                // 勝利 Victory
                modalBadgeBg.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-3xl mb-4 border-4 bg-amber-500/20 border-amber-400 text-amber-400 shadow-amber-500/50 shadow-xl';
                modalIcon.className = 'fa-solid fa-trophy';
                modalTitle.className = 'text-3xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-yellow-500';
                modalTitle.textContent = '大獲全勝！VICTORY';
                modalSubtitle.textContent = '你的手速完全碾壓了 AI 機器人！';
                marginText.className = 'text-xl sm:text-2xl font-black text-amber-400';
                marginText.textContent = `你領先了 AI 超過 ${diff} 次點擊！`;

                // 觸發彩帶狂歡特效
                fireConfetti();
                playSound(600, 'sine', 0.1);
                setTimeout(() => playSound(800, 'sine', 0.2), 100);

            } else if (diff < 0) {
                // 敗北 Defeat
                const absDiff = Math.abs(diff);
                modalBadgeBg.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-3xl mb-4 border-4 bg-red-500/20 border-red-500 text-red-500 shadow-red-500/50 shadow-xl';
                modalIcon.className = 'fa-solid fa-skull-crossbones';
                modalTitle.className = 'text-3xl font-black mb-1 text-red-500';
                modalTitle.textContent = '挑戰失敗！DEFEAT';
                modalSubtitle.textContent = '再接再厲，提升手速再來挑戰！';
                marginText.className = 'text-xl sm:text-2xl font-black text-red-400';
                marginText.textContent = `AI 比你多點擊了 ${absDiff} 下！`;

                playSound(200, 'sawtooth', 0.3);

            } else {
                // 平手 Draw
                modalBadgeBg.className = 'w-20 h-20 mx-auto rounded-full flex items-center justify-center text-3xl mb-4 border-4 bg-slate-500/20 border-slate-400 text-slate-300 shadow-slate-500/50 shadow-xl';
                modalIcon.className = 'fa-solid fa-handshake';
                modalTitle.className = 'text-3xl font-black mb-1 text-slate-200';
                modalTitle.textContent = '勢均力敵！DRAW';
                modalSubtitle.textContent = '你與 AI 展現了完全一樣的反應速度！';
                marginText.className = 'text-xl sm:text-2xl font-black text-slate-300';
                marginText.textContent = '雙方點擊數完全相同！';
            }

            // 開啟 Modal 動畫
            resultModal.classList.remove('hidden');
            setTimeout(() => {
                resultModal.classList.remove('opacity-0');
                modalCard.classList.remove('scale-90');
                modalCard.classList.add('scale-100');
            }, 10);
        }

        function hideResultModal() {
            resultModal.classList.add('opacity-0');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            setTimeout(() => {
                resultModal.classList.add('hidden');
            }, 300);
        }

        // --- 勝利彩帶發射特效 ---
        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        // --- 事件監聽 Listeners ---
        startBtn.addEventListener('click', () => {
            startGame();
        });

        clickBtn.addEventListener('pointerdown', (e) => {
            handlePlayerClick(e);
        });

        restartBtn.addEventListener('click', () => {
            hideResultModal();
            resetGame();
            setTimeout(startGame, 300);
        });

        // 支援空白鍵 (Space) 快速連點
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isGaming && !clickBtn.disabled) {
                    handlePlayerClick(null);
                }
            }
        });

        // 初始化遊戲狀態
        resetGame();
    </script>
</body>
</html>
